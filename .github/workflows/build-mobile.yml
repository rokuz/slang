name: Build Mobile

on:
  workflow_dispatch:
    inputs:
      slang_ref:
        description: 'Slang release tag to build (e.g. v2026.16)'
        required: true
        default: 'v2026.16'
      build_android:
        description: 'Build Android (arm64-v8a and x86_64)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS device and simulator'
        required: false
        type: boolean
        default: false
      ndk_version:
        description: 'NDK version for the Android build (r28+ aligns to 16 KB pages)'
        required: false
        default: '29.0.14206865'


jobs:
  build-android:
    name: build-android
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: Track upstream
        run: git remote add upstream https://github.com/shader-slang/slang.git

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${{ inputs.ndk_version }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ inputs.ndk_version }}" >> "$GITHUB_ENV"

      - name: Build Slang for Android
        run: |
          echo "Android NDK: $ANDROID_NDK_HOME"
          python3 extras/build-mobile.py --tag "${{ inputs.slang_ref }}" --local=android

      - name: Check the 16 KB page alignment
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          rm -rf alignment-check
          for zip in build-mobile-staging/*android*.zip; do
            unzip -q -o "$zip" -d alignment-check
          done
          found=0
          for so in $(find alignment-check -name '*.so'); do
            found=1
            align=$("$readelf" -l "$so" | awk '/LOAD/ {print $NF; exit}')
            echo "$so $align"
            if [ "$align" != "0x4000" ]; then
              echo "::error::$so is aligned to $align, expected 0x4000"
              exit 1
            fi
          done
          if [ "$found" != "1" ]; then
            echo "::error::no shared libraries found in build-mobile-staging"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slang-android
          path: build-mobile-staging/*.zip
          if-no-files-found: error

  build-ios:
    name: build-ios
    if: ${{ inputs.build_ios }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: brew install ninja

      - name: Track upstream
        run: git remote add upstream https://github.com/shader-slang/slang.git

      - name: Build Slang for iOS
        run: python3 extras/build-mobile.py --tag "${{ inputs.slang_ref }}" --local=ios,ios-simulator

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slang-ios
          path: build-mobile-staging/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [build-android, build-ios]
    if: ${{ always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.slang_ref }}-mobile
          name: Slang ${{ inputs.slang_ref }} - Mobile
          body: |
            Mobile libraries built from upstream shader-slang/slang `${{ inputs.slang_ref }}` by `extras/build-mobile.py`.

            | Platform | Architecture | Backend | Libraries |
            |---|---|---|---|
            | Android | arm64-v8a, x86_64 | SPIR-V | shared (`.so`) |
            | iOS, iOS Simulator | arm64 | MSL | static (`.a`) |

            Only the platforms selected in the workflow run are attached.
          files: artifacts/*.zip
          fail_on_unmatched_files: true
